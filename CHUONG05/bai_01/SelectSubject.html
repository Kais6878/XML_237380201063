<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>SelectSubject</title>
    <style>
        table { border-collapse: collapse; width: 80%; margin: 20px auto; }
        th, td { border: 1px solid black; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h2 style="text-align: center;">MÔN HỌC - NHÀ XUẤT BẢN MINH KHAI</h2>
    <table id="subjectTable">
        <thead>
            <tr>
                <th>STT</th>
                <th>Tên môn học</th>
                <th>Nhà xuất bản</th>
                <th>Tác giả</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        let xhr = new XMLHttpRequest();
        xhr.open("GET", "dsmonhoc.xml", true);
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
                let xmlDoc = xhr.responseXML;
                let subjects = xmlDoc.getElementsByTagName("subject");
                let tbody = document.querySelector("#subjectTable tbody");
                let count = 1;

                for (let i = 0; i < subjects.length; i++) {
                    let publisher = subjects[i].getElementsByTagName("publisher")[0].textContent.trim();
                    if (publisher === "Minh Khai") {
                        let title = subjects[i].getElementsByTagName("title")[0].textContent;
                        let author = subjects[i].getElementsByTagName("author")[0].textContent;

                        let row = `<tr>
                            <td>${count++}</td>
                            <td>${title}</td>
                            <td>${publisher}</td>
                            <td>${author}</td>
                        </tr>`;
                        tbody.innerHTML += row;
                    }
                }
            }
        };
        xhr.send();
    </script>
</body>
</html>
